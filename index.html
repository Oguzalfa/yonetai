.brand-name{font-size:23px;font-weight:800;color:#102D50;letter-spacing:-1.3px}
.brand-name span{color:#1B73D7}
.brand-caption{font-size:8px;letter-spacing:1.85px;color:#97A9BF;margin-top:1px}
.property{margin:0 7px 28px;padding:11px 10px;border-radius:11px;border:1px solid #DDE8F3;background:#F8FAFD;gap:10px}
.property-icon{background:#E8F2FD;color:#1468BB;width:34px;height:34px;border-radius:9px}
.property strong{font-size:12px;color:#1E3859}
.property span{color:#8093AA;font-size:10px}
.property >svg:last-child{color:#9CACBF}
.nav-group{font-size:9px;color:#A1AFC0;letter-spacing:1.5px;font-weight:800;margin:13px 16px 9px}
.nav-link{border-radius:9px;min-height:39px;font-size:12.5px;color:#63738A;font-weight:600;gap:12px;padding:9px 13px;position:relative;transition:background .14s ease,color .14s ease}
.nav-link svg{color:#788DA6;stroke-width:1.65;opacity:1}
.nav-link:hover{background:#F4F7FB;color:#184370}
.nav-link.active{color:#1156A1;background:#EDF5FF;box-shadow:none;font-weight:800}
.nav-link.active::before{content:"";position:absolute;left:0;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:#1F72D5}
.nav-link.active svg{color:#166AC0}
.nav-count{border-radius:5px;background:#ECF4FF;color:#145EAE;font-size:10px}
.sidebar-footer{padding:22px 7px 7px}
.sidebar-foot-card{border:1px solid #E3EAF2;border-radius:12px;background:#FAFBFE;padding:14px}
.sidebar-foot-card b{color:#294769;font-size:11px;display:flex;align-items:center;gap:4px}
.sidebar-foot-card p{color:#8498AE;font-size:10px}
.sidebar-foot-card .btn{background:#fff;border:1px solid #E2E9F2;color:#26598F}
.sidebar-meta{color:#ACB6C4;letter-spacing:.75px;font-size:8px}
.main-wrap{margin-left:236px;width:calc(100% - 236px)}
.topbar{height:74px;background:rgba(255,255,255,.96);padding:0 40px;border-bottom-color:#E6EDF3;box-shadow:none}
.top-left,.top-right{gap:14px}
.breadcrumb{font-size:12px;color:#8B9DB0}
.breadcrumb b{font-weight:750;color:#315170}
.search{border:1px solid #E4EAF0;border-radius:11px;background:#F8FAFC;height:41px;width:min(360px,35vw)}
.search:focus-within{border-color:#8CB5EA;box-shadow:0 0 0 3px rgba(22,105,201,.06)}
.search input{font-size:12px}
.top-button{width:40px;height:40px;border-radius:11px;border-color:#E2EAF1;color:#3F5B7B}
.top-button:hover{background:#F3F7FC;border-color:#C6D8EC}
.identity{gap:12px;border-color:#E3EAF2}
.identity b{font-size:12px}
.identity small{font-size:10px}
.avatar{border-radius:50%;background:#E7F2FF;color:#1664B6}
.role-picker{font-size:11px}
.demo-tag{font-size:9px!important;font-weight:700!important;letter-spacing:.3px}
.page{max-width:1540px;padding:31px 40px 80px}
.page-title{align-items:flex-end;margin-bottom:26px;gap:24px}
.eyebrow{font-size:9px;letter-spacing:1.35px;color:#3976B8;margin-bottom:10px;font-weight:800}
.page-title h1{font-size:clamp(28px,2.8vw,37px);font-weight:750;color:#172F4F;letter-spacing:-1.45px}
.subtitle{font-size:12.5px;line-height:1.6;color:#7D8EA4;margin-top:7px}
.header-actions{gap:9px}
.btn{min-height:41px;padding:10px 15px;font-size:12px;font-weight:700;letter-spacing:-.1px;border-radius:10px;border-color:#DEE7F0;box-shadow:0 1px 0 rgba(30,53,88,.025);transition:background .15s,border-color .15s,transform .15s}
.btn:hover{transform:translateY(-1px);border-color:#B4CBE4}
.btn.primary{background:#176BD1;border-color:#176BD1;box-shadow:0 5px 13px rgba(21,95,196,.12)}
.btn.primary:hover{background:#0F58B1;border-color:#0F58B1}
.btn.soft{background:#EAF3FE;color:#185FAD;border-color:#DCEAFF}
.btn.small{font-size:11px;min-height:36px;padding:8px 12px}
.grid{gap:15px}.split,.split-alt{gap:15px}
.card{border:1px solid #E4EAF0;border-radius:15px;box-shadow:0 3px 13px rgba(14,42,82,.023)}
.card-pad{padding:24px}
.metric{min-height:134px;padding:20px 22px 18px;border-radius:14px}
.metric:before{content:"";position:absolute;left:22px;right:22px;top:0;height:2px;background:linear-gradient(90deg,#2078D6,transparent 60%);opacity:.65}
.metric-top{color:#72859C;font-size:12px;font-weight:700}
.metric-icon{background:transparent;color:#8EADD0;width:25px;height:25px}
.metric-val{color:#102B50;font-size:clamp(24px,2.3vw,33px);line-height:1.08;letter-spacing:-1.45px;margin:19px 0 9px;font-weight:800}
.metric-bottom{font-size:11px;line-height:1.35;color:#8A9AAF}

.hero::before{content:"";position:absolute;inset:0 0 0 auto;width:51%;background-image:linear-gradient(90deg,#0e315b 0%,rgba(14,49,91,.15) 28%,rgba(14,49,91,.02) 100%),var(--cover-photo,linear-gradient(120deg,#1b4f78,#7daed9));background-position:center,center;background-size:cover;border-radius:0 15px 15px 0;z-index:-1}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(14,49,91,.06) 46%,rgba(14,49,91,.03) 100%);z-index:-1;pointer-events:none}
.hero-top{top:25px;left:34px;gap:9px}

.hero h2{font-size:clamp(31px,3.2vw,42px);letter-spacing:-1.95px;max-width:52%;line-height:1.07;font-weight:750;margin-bottom:10px}
.hero p{font-size:12.5px;color:#CFDEEF;max-width:48%;line-height:1.55}
.hero-actions{margin-top:20px;gap:9px}
.hero .btn{border-radius:9px;min-height:39px}
.hero .btn.ghost{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.23)}
.section-head{margin-bottom:19px;align-items:center}
.section-head h3{font-size:16px;font-weight:750;letter-spacing:-.5px;color:#193450}
.section-head p{font-size:11.5px;line-height:1.6;color:#8B9BAE}
.section-link{font-size:11.5px;font-weight:750;color:#1B6BC5}
.seg{background:#F0F4F9;border-radius:9px}.seg button{font-size:10px;border-radius:7px}
.chart-wrap{height:225px}.chart-label{fill:#879BB2}.legend{font-size:11px}
.quick{gap:10px}.quick-item{border:1px solid #E4EBF2;border-radius:11px;padding:13px 12px;transition:background .15s,border-color .15s}
.quick-item:hover{background:#F5F9FE;border-color:#CADCEC}
.quick-icon{background:#ECF4FE;color:#236EBF;border-radius:9px;width:38px;height:38px}
.quick-title strong{font-size:12px;font-weight:750}.quick-title small{font-size:11px;margin-top:4px;line-height:1.5}
.activity{padding:13px 0!important}.activity-body strong{font-size:12.5px!important}.activity-body small{font-size:11px!important}.activity-price{font-size:13px!important}
.bars{gap:22px}.bar-label{font-size:11.5px!important}.bar-track{height:6px!important}
.notice{background:#F5F9FE;border-radius:9px}

.resident-hero::before{content:"";position:absolute;inset:0 0 0 44%;background-image:linear-gradient(90deg,#0B315D,rgba(11,49,93,.03)),var(--resident-photo,linear-gradient(140deg,#1a5c92,#a4c5dc));background-size:cover;background-position:center;z-index:-1}
.resident-hero h2{font-size:30px;letter-spacing:-1.1px;max-width:65%;line-height:1.15}
.resident-hero p{max-width:60%;font-size:12.5px;line-height:1.5;color:#D4E2F2}
.resident-card{border-top:2px solid #2076CF;border-radius:14px}.resident-card h2{font-size:32px;letter-spacing:-1.2px}
.resident-card p{font-size:11.5px}.resident-shortcuts{gap:12px}.shortcut{min-height:105px;border:1px solid #E2EAF2;background:#fff;border-radius:13px;font-weight:700;color:#284968;transition:transform .16s,box-shadow .16s,border-color .16s}
.shortcut:hover{transform:translateY(-2px);border-color:#B9D5F0;box-shadow:0 8px 17px rgba(20,62,109,.06)}
.shortcut span{color:#1767C2}
.site-banner .photo{background-image:var(--amenity-photo,linear-gradient(130deg,#E7EFF8,#90B3D4))!important;background-position:center;background-size:cover}
.site-banner .info h3{font-size:18px}.site-banner .info p{font-size:12px;line-height:1.55}
.resource-card{border-radius:12px}.resource-card:hover{border-color:#B8CFE7}
.modal{border-radius:16px}.modal-head{border-bottom-color:#E8EDF3}
.field input,.field select,.field textarea{min-height:41px;border-color:#DFE8F2}
.records-list .record-row:hover{background:#F8FAFE}
.context-ribbon{background:#F3F8FF;color:#416584;border-color:#E1EBF6;border-radius:10px}
.mobile-nav{background:rgba(255,255,255,.96);box-shadow:0 -2px 16px rgba(18,48,83,.04)}
.mobile-nav button{transition:color .15s,transform .15s}.mobile-nav button:active{transform:scale(.96)}
.footer-note{color:#96A6B6!important;font-size:10px!important}
.page>.card,.page>.grid,.page>.split,.page>.split-alt{animation:pageEntrance .25s ease both}
@keyframes pageEntrance{from{opacity:.7;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}

 .btn{min-height:43px;font-size:12px}

 .hero h2{max-width:83%;font-size:30px}.hero p{max-width:80%;font-size:11.5px}.hero .btn{min-height:39px}

var canSubmit=['newTicket','serviceRequest','newNews','newVisitor','newDues','newBooking','newMove','newDocument','newPoll','search'].includes(kind);return '<div class="modal-scrim" data-action="modalBackdrop"><section class="modal" role="dialog" aria-modal="true" aria-label="'+esc(heading)+'"><div class="modal-head"><h3>'+esc(heading)+'</h3><button class="close-icon" data-action="closeModal" aria-label="Kapat">'+icon('close',17)+'</button></div><div class="modal-body">'+body+'</div><div class="modal-actions">'+button('Vazgeç','closeModal','','close')+(canSubmit?'<button type="submit" form="'+(kind==='newNews'?'form-news':kind==='newVisitor'?'form-visitor':kind==='newDues'?'form-dues':kind==='newBooking'?'form-booking':kind==='newMove'?'form-move':kind==='newDocument'?'form-document':kind==='newPoll'?'form-poll':kind==='search'?'form-search':'form-ticket')+'" class="btn primary">'+esc(({newBooking:'Başvuruyu Kaydet',newMove:'Bildirim Oluştur',newDocument:'Özeti Kaydet',newPoll:'Anketi Kaydet',newNews:'Duyuruyu Kaydet',newDues:'Tahakkuku Kaydet',search:'Ara',newTicket:'Talebi Kaydet',serviceRequest:'Talebi Kaydet'})[kind]||'Kaydet')+' '+icon('arrow',13)+'</button>':kind==='pay'?button('Simülasyonu Onayla','simulatePay','primary','check'):'')+'</div></section></div>';}
function screen(){switch(state.page){case 'overview':return dashboard();case 'resident':return residentPage();case 'field':return fieldPage();case 'dues':return duesPage();case 'units':return unitsPage();case 'meters':return meterPage();case 'tickets':return ticketPage();case 'news':return newsPage();case 'visitors':return visitorPage();case 'services':return servicesPage();case 'finance':return financePage();case 'bookings':return bookingsPage();case 'documents':return documentsPage();case 'bank':return bankPage();case 'moves':return movesPage();case 'polls':return pollsPage();case 'settings':return settingsPage();default:return state.role==='resident'?residentPage():dashboard();}}
function render(){if(!navSet().some(function(x){return x[0]===state.page;}))state.page=state.role==='admin'?'overview':state.role==='resident'?'resident':'field';document.getElementById('app').innerHTML=shell(screen());}
function openModal(type,extra){state.modal=Object.assign({type:type},extra||{});render();var first=document.querySelector('.modal input:not([disabled]),.modal textarea:not([disabled]),.modal select:not([disabled]),.modal .close-icon');if(first)first.focus();}
function csvDownload(filename,cols,rows){var csv='\uFEFF'+[cols].concat(rows).map(function(row){return row.map(function(v){return '"'+String(v==null?'':v).replace(/"/g,'""')+'"';}).join(';');}).join('\r\n');var url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));var a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(url);},1000);toast('CSV dosyası oluşturuldu.');}
function act(a,b){if(navSet().some(function(item){return item[0]===a;})){go(a);return;}if(a==='goNews'){state.modal=null;go('news');return;}if(a==='goDues'){state.modal=null;go('dues');return;}if(a==='goTickets'){state.modal=null;go('tickets');return;}if(a==='goDocuments'){state.modal=null;go('documents');return;}if(a==='bankInfo'){openModal('info',{title:'Eşleştirme İncelemesi',body:'Bu örnek hareket için aynı tutarda açık bir borç ve güvenilir daire eşleşmesi bulunamadı. Manuel inceleme gerekir.'});return;}if(a==='units'){go('units');return;}if(['newBooking','newMove','newDocument','newPoll'].includes(a)){openModal(a);return;}if(a==='quickActions'){openModal('quickActions');return;}if(a==='search'){openModal('search',{query:state.query});return;}if(a==='openDocument'){var d=state.documents.find(function(x){return String(x.id)===String(b);});if(d)openModal('document',{id:d.id});return;}if(a==='approveBooking'||a==='rejectBooking'||a==='cancelBooking'){var booking=state.bookings.find(function(x){return String(x.id)===String(b);});if(!booking)return;if(a==='cancelBooking'&&state.role!=='admin'&&booking.unit!=='B-08')return;if(a!=='cancelBooking'&&state.role!=='admin')return;booking.status=a==='approveBooking'?'Onaylandı':a==='rejectBooking'?'Reddedildi':'İptal edildi';save('bookings',state.bookings);render();toast('Rezervasyonun örnek durumu güncellendi.');return;}if(a==='approveMove'||a==='rejectMove'){if(state.role!=='admin')return;var moving=state.moves.find(function(x){return String(x.id)===String(b);});if(!moving)return;moving.status=a==='approveMove'?'Onaylandı':'Reddedildi';save('moves',state.moves);render();toast('Taşınma bildiriminin örnek durumu güncellendi.');return;}if(a==='closePoll'){if(state.role!=='admin')return;var closing=state.polls.find(function(x){return String(x.id)===String(b);});if(closing){closing.closed=true;save('polls',state.polls);render();toast('Anket kapatıldı.');}return;}if(a==='castVote'){if(state.role!=='resident'){toast('Bu örnek oylamaya sadece sakin rolü katılabilir.');return;}var poll=state.polls.find(function(x){return String(x.id)===String(b);});if(!poll||poll.closed||poll.votes['B-08']!=null)return;openModal('vote',{id:poll.id});return;}if(a==='matchBank'){if(state.role!=='admin')return;var movement=state.bank.find(function(x){return String(x.id)===String(b);});if(!movement||movement.status==='Eşleştirildi')return;var unit=state.units.find(function(u){return u.unit===movement.unit&&Number(u.amount)===Number(movement.amount)&&!/^Ödendi|^İşlendi/.test(u.status);});if(!unit){toast('Eşleşen açık borç bulunamadı; kayıt incelemeye bırakıldı.');return;}movement.status='Eşleştirildi';unit.status='Ödendi';save('bank',state.bank);save('units',state.units);render();toast('Örnek banka hareketi ve daire borcu eşleştirildi.');return;}if(a==='export'){act('duesCSV');return;}if(a==='navToggle'){state.nav=!state.nav;render();return;}if(a==='navClose'){state.nav=false;render();return;}if(a==='closeModal'||a==='modalBackdrop'){state.modal=null;render();return;}if(a==='newTicket'||a==='newNews'||a==='newVisitor'||a==='newDues'||a==='pay'||a==='assistant'||a==='serviceRequest'){openModal(a,b?{service:b}:{});return;}if(a==='notifications'){openModal('notifications');return;}if(a==='newOperation'){openModal('quickActions');return;}if(a==='reminder'){openModal('info',{title:'Hatırlatma Ön İzlemesi',body:'Bekleyen ve geciken dairelere gönderilecek örnek SMS/e-posta metni hazırlandı. Hiçbir mesaj gönderilmedi.'});return;}if(a==='range6'){state.range='6';render();return;}if(a==='range12'){state.range='12';render();return;}if(a==='duesCSV'||a==='unitsCSV'){csvDownload(a==='duesCSV'?'yonetai-aidat-demo.csv':'yonetai-daireler-demo.csv',['Daire','Sakin','Blok','Tutar','Durum','Dönem'],state.units.map(function(x){return[x.unit,x.name,x.block,x.amount,x.status,'Kasım 2026'];}));return;}if(a==='metersCSV'){csvDownload('yonetai-sayac-demo.csv',['Daire','SayacID','Su_m3','Elektrik_kWh','Gaz_m3','Pil','Durum','Tarih'],state.meters.map(function(x){return[x.unit,x.id,x.water,x.electric,x.gas,x.battery,x.status,x.date];}));return;}if(a==='csvImport'){document.getElementById('meter-csv')?.click();return;}if(a==='print'){window.print();return;}if(a==='simulatePay'){var u=state.units.find(function(x){return x.unit==='B-08';});if(u){u.status='İşlendi (demo)';save('units',state.units);}state.modal=null;render();toast('Ödeme simülasyonu tamamlandı. Gerçek tahsilat yapılmadı.');return;}if(a==='advanceTicket'){var t=state.tickets.find(function(x){return String(x.id)===String(b);});if(t){t.status=t.status==='Yeni'?'Atandı':t.status==='Atandı'?'İşlemde':t.status==='İşlemde'?'Tamamlandı':'Tamamlandı';save('tickets',state.tickets);render();toast('İş emri demo aşaması güncellendi.');}return;}if(a==='duesRow'||a==='unitDetails'){var u=state.units.find(function(x){return String(x.id)===String(b);});if(u)openModal('info',{title:u.unit+' · '+u.name,body:'Blok: '+u.block+' · Dönem: Kasım 2026 · Tutar: '+currency(u.amount)+' · Durum: '+u.status+'. Bu kayıt demo amaçlıdır.'});return;}if(a==='copyCode'){var v=state.visitors[Number(b)];if(v){if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(v.code).then(function(){toast('Örnek kod kopyalandı.');}).catch(function(){toast('Kod: '+v.code);});else toast('Örnek kod: '+v.code);}return;} }
document.addEventListener('click',function(e){var voteButton=e.target.closest('[data-vote]');if(voteButton){if(state.role!=='resident'){toast('Yalnızca sakin rolüyle oy kullanılabilir.');return;}var poll=state.polls.find(function(p){return String(p.id)===String(voteButton.getAttribute('data-vote'));});var idx=Number(voteButton.getAttribute('data-index'));if(!poll||poll.closed||poll.votes['B-08']!=null||idx<0||idx>=poll.options.length)return;poll.votes['B-08']=idx;save('polls',state.polls);render();toast('Örnek oyunuz kaydedildi.');return;}var x=e.target.closest('[data-go]');if(x){go(x.getAttribute('data-go'));return;}var y=e.target.closest('[data-tab]');if(y){state.tab=y.getAttribute('data-tab');render();return;}var z=e.target.closest('[data-meter]');if(z){state.meterKind=z.getAttribute('data-meter');render();return;}var b=e.target.closest('[data-action]');if(b){if(b.getAttribute('data-action')==='modalBackdrop'&&e.target!==b)return;act(b.getAttribute('data-action'),b.getAttribute('data-id')||b.getAttribute('data-service'));}});
document.addEventListener('change',function(e){if(e.target.id==='role-select'){switchRole(e.target.value);return;}if(e.target.id==='meter-csv'){
 var file=e.target.files&&e.target.files[0];if(!file)return;
 if(file.size>1024*1024){toast('CSV dosyası 1 MB sınırını aşıyor.');e.target.value='';return;}
 var reader=new FileReader();reader.onload=function(){
  try{
   var lines=String(reader.result).replace(/^\uFEFF/,'').split(/\r?\n/).filter(function(l){return l.trim();});
   if(lines.length<2)throw Error('Boş CSV');
   var separator=lines[0].includes(';')?';':',';
   function fields(line){var result=[],part='',quoted=false;
    for(var i=0;i<line.length;i++){var ch=line[i];if(ch==='"'){
     if(quoted&&line[i+1]==='"'){part+='"';i++;}else quoted=!quoted;
    }else if(ch===separator&&!quoted){result.push(part.trim());part='';}else part+=ch;}
    if(quoted)throw Error('Kapanmamış CSV alanı');result.push(part.trim());return result;
   }
   var header=fields(lines[0]).map(function(v){return v.toLocaleLowerCase('tr').replace(/[\s-]+/g,'_');});
   var ixUnit=header.indexOf('daire');if(ixUnit<0)ixUnit=header.indexOf('unit');if(ixUnit<0)ixUnit=0;
   var ixWater=header.findIndex(function(h){return h==='su_m3'||h==='su'||h==='su_tuketimi';});if(ixWater<0)ixWater=2;
   var changed=0;lines.slice(1,501).forEach(function(line){
    var row=fields(line),unit=(row[ixUnit]||'').trim(),meter=state.meters.find(function(m){return m.unit===unit;});if(!meter)return;
    var raw=(row[ixWater]||'').replace(/\s/g,'');if(!raw)return;
    var numeric=Number(raw.includes(',')?raw.replace(/\./g,'').replace(',','.'):raw);
    if(!Number.isFinite(numeric)||numeric<0||numeric>1000000)return;
    meter.water=numeric;meter.date=new Date().toLocaleDateString('tr-TR',{day:'numeric',month:'short',year:'numeric'});meter.status='İçe aktarıldı';changed++;
   });
   if(!changed){toast('Eşleşen daire ve geçerli su endeksi bulunamadı.');return;}
   save('meters',state.meters);render();toast(changed+' örnek sayaç endeksi içe aktarıldı.');
  }catch(ex){toast('CSV okunamadı. Daire ve Su_m3 başlıklarını kontrol edin.');}finally{e.target.value='';}
 };reader.readAsText(file,'UTF-8');return;
 }});
document.addEventListener('input',function(e){if(e.target.id==='filter-search'){var pos=e.target.selectionStart;state.query=e.target.value;var root=e.target.closest('.page');if(!root)return;var page=state.page;render();var x=document.getElementById('filter-search');if(x){x.focus();try{x.setSelectionRange(pos,pos);}catch(ignore){}}return;}});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&state.modal){state.modal=null;render();return;}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();document.getElementById('global-search')?.focus();return;}if(e.key==='Enter'&&e.target.id==='global-search'){e.preventDefault();openModal('search',{query:e.target.value.trim()});}});
document.addEventListener('submit',function(e){var form=e.target;if(!form||!form.id.startsWith('form-'))return;e.preventDefault();var v=Object.fromEntries(new FormData(form));if(form.id==='form-ticket'){state.tickets.unshift({id:Math.max.apply(null,state.tickets.map(function(x){return x.id;}))+1,title:v.title,category:v.category,unit:state.role==='resident'?'B-08':v.unit,status:'Yeni',priority:v.priority,owner:'Atanmadı',desc:v.desc});save('tickets',state.tickets);state.modal=null;go('tickets');toast('Demo talebi oluşturuldu. Gerçek sisteme gönderilmedi.');}else if(form.id==='form-news'){state.news.unshift({id:Date.now(),title:v.title,body:v.body,kind:v.kind,date:'25 Kas 2026'});save('news',state.news);state.modal=null;go('news');toast('Duyuru bu tarayıcıya kaydedildi.');}else if(form.id==='form-visitor'){var code=String(Math.floor(100000+Math.random()*899999));state.visitors.unshift({name:v.name,unit:state.role==='resident'?'B-08':v.unit,date:v.date,status:'Onaylı',code:code});save('visitors',state.visitors);state.modal=null;go('visitors');toast('Demo ziyaretçi kodu oluşturuldu: '+code);}else if(form.id==='form-dues'){var u=state.units.find(function(x){return String(x.id)===String(v.id);});if(u){u.amount=Number(v.amount);u.status='Bekliyor';save('units',state.units);}state.modal=null;go('dues');toast('Örnek tahakkuk kaydı güncellendi.');}else if(form.id==='form-booking'){var bookingUnit=state.role==='resident'?'B-08':v.unit;if(!bookingUnit||!v.date||!v.time||!v.resource)return;if(v.date<todayISO()){toast('Geçmiş tarihe rezervasyon oluşturulamaz.');return;}var collides=state.bookings.some(function(b){return b.resource===v.resource&&b.date===v.date&&b.time===v.time&&b.status!=='Reddedildi'&&b.status!=='İptal edildi';});if(collides){toast('Bu zaman diliminde örnek bir talep zaten var. Başka saat seçin.');return;}state.bookings.unshift({id:Date.now(),resource:v.resource,date:v.date,time:v.time,unit:bookingUnit,note:v.note||'',status:'Onay bekliyor'});save('bookings',state.bookings);state.modal=null;go('bookings');toast('Rezervasyon talebiniz örnek kayıtlara eklendi.');}
else if(form.id==='form-move'){var moveUnit=state.role==='resident'?'B-08':v.unit;if(!moveUnit||!v.date||!v.time)return;if(v.date<todayISO()){toast('Geçmiş tarihli bildirim oluşturulamaz.');return;}state.moves.unshift({id:Date.now(),unit:moveUnit,kind:v.kind||'Taşınma',date:v.date,time:v.time,note:v.note||'',status:'Onay bekliyor'});save('moves',state.moves);state.modal=null;go('moves');toast('Taşınma bildirimi yerel kayıtlarınıza eklendi.');}
else if(form.id==='form-document'){if(state.role!=='admin')return;state.documents.unshift({id:Date.now(),title:v.title.trim(),category:v.category,body:v.body.trim(),date:todayISO()});save('documents',state.documents);state.modal=null;go('documents');toast('Belge özeti örnek kayıtlara eklendi.');}
else if(form.id==='form-search'){openModal('search',{query:(v.q||'').trim()});}
else if(form.id==='form-poll'){if(state.role!=='admin')return;var options=(v.options||'').split(/\r?\n/).map(function(x){return x.trim();}).filter(Boolean);if(options.length<2||options.length>5||new Set(options.map(function(x){return x.toLocaleLowerCase('tr');})).size!==options.length){toast('2–5 farklı seçenek girin.');return;}state.polls.unshift({id:Date.now(),title:v.title.trim(),description:v.description.trim(),options:options,votes:{},closed:false,date:todayISO()});save('polls',state.polls);state.modal=null;go('polls');toast('Anket örnek olarak kaydedildi.');}});
render();
})();
